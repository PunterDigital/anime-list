version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # vue-tsc 3.3.12-3.3.14 fail types:check on any https:// in a template
      # attribute (vuejs/language-tools#6240). package.json pins 3.3.11.
      - dependency-name: vue-tsc
        versions: ["3.3.12", "3.3.13", "3.3.14"]

  - package-ecosystem: npm
    directory: /chrome-extension
    schedule:
      interval: weekly
    groups:
      extension-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) has no JS compiler API, and vue-tsc
      # needs one (`typescript/lib/tsc`). Stay on 6.x until vue-tsc supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
