version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # PrimeVue 5 is a commercial PrimeUI package that needs a licence key.
      # Stay on 4.5 (MIT) until AniTrack moves off PrimeVue (card #4272).
      - dependency-name: primevue
        versions: [">=5"]
      - dependency-name: "@primevue/*"
        versions: [">=5"]

  - package-ecosystem: npm
    directory: /chrome-extension
    schedule:
      interval: weekly
    groups:
      extension-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) has no JS compiler API, and vue-tsc
      # needs one (`typescript/lib/tsc`). Stay on 6.x until vue-tsc supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
