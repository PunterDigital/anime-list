name: Release

# AniTrack is a web app: Forge deploys every push to main, so a release is a
# version tag plus a GitHub Release with notes from the merged PRs. The Chrome
# extension has its own `extension-v*` tags (extension-release.yml).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "AniTrack $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
